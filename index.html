<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nahuatl Learning & Dictionary Hub</title>
    <style>
        :root {
            --primary: #7b2d26;
            --primary-dark: #4a1510;
            --accent: #d97706;
            --bg: #faf7f2;
            --card-bg: #ffffff;
            --text: #2b2b2b;
            --gray: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding-bottom: 3rem;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 4px solid var(--primary-dark);
        }

        header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        header p { opacity: 0.9; font-size: 0.95rem; }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--gray);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }

        h2 { color: var(--primary); margin-bottom: 1rem; font-size: 1.35rem; }

        /* Search Bar */
        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--primary); }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary-dark); }

        /* Results List */
        .results-list {
            list-style: none;
        }

        .result-item {
            padding: 1rem;
            border-bottom: 1px solid var(--gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-item:last-child { border-bottom: none; }
        .word { font-weight: bold; color: var(--primary); font-size: 1.1rem; }
        .translation { color: #4b5563; }

        /* Flashcard Practice Mode */
        .flashcard {
            background: var(--primary-dark);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            user-select: none;
        }

        .flashcard .prompt { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; margin-bottom: 0.5rem; }
        .flashcard .term { font-size: 2.2rem; font-weight: bold; }

        .flashcard-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
        }

        .stats {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <header>
        <h1>Nahuatl Vocabulary & Dictionary</h1>
        <p>Interactive study tool and word lookup ready for GitHub Pages</p>
    </header>

    <div class="container">
        
        <!-- Dictionary Search Section -->
        <div class="card">
            <h2>Dictionary Search</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Nahuatl or English word (e.g., calli, house)..." oninput="filterDictionary()">
                <button onclick="filterDictionary()">Search</button>
            </div>
            <ul id="resultsList" class="results-list">
                <!-- Populated dynamically via JS -->
            </ul>
        </div>

        <!-- Flashcard Practice Section -->
        <div class="card">
            <h2>Interactive Flashcards</h2>
            <div class="stats">
                <span id="cardCounter">Card 1 of 5</span>
                <span id="scoreTracker">Streak: 0</span>
            </div>
            <div class="flashcard" id="flashcardElement" onclick="flipCard()">
                <div class="prompt" id="cardPrompt">Nahuatl Term</div>
                <div class="term" id="cardTerm">Calli</div>
            </div>
            <div class="flashcard-controls">
                <button onclick="prevCard()" style="background: #4b5563;">Previous</button>
                <button onclick="nextCard()">Next Card</button>
            </div>
        </div>

    </div>

    <script>
        // Dictionary Dataset
        const dictionaryData = [
            { word: "Calli", translation: "House", category: "Noun" },
            { word: "Metl", translation: "Agave / Century plant", category: "Noun" },
            { word: "Tlalli", translation: "Earth / Land", category: "Noun" },
            { word: "Atl", translation: "Water", category: "Noun" },
            { word: "Tonatiuh", translation: "Sun", category: "Noun" },
            { word: "Māitl", translation: "Hand / Arm", category: "Noun" },
            { word: "Yōllotl", translation: "Heart", category: "Noun" }
        ];

        // Search Logic
        function renderDictionary(items) {
            const list = document.getElementById('resultsList');
            list.innerHTML = '';
            
            if (items.length === 0) {
                list.innerHTML = '<li class="result-item">No matching words found.</li>';
                return;
            }

            items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'result-item';
                li.innerHTML = `
                    <span class="word">${item.word} <small style="font-weight:normal; color:#888;">(${item.category})</small></span>
                    <span class="translation">${item.translation}</span>
                `;
                list.appendChild(li);
            });
        }

        function filterDictionary() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = dictionaryData.filter(item => 
                item.word.toLowerCase().includes(query) || 
                item.translation.toLowerCase().includes(query)
            );
            renderDictionary(filtered);
        }

        // Flashcard Logic
        let currentCardIndex = 0;
        let showingTranslation = false;
        let streak = 0;

        const flashcards = [
            { nahuatl: "Calli", english: "House" },
            { nahuatl: "Atl", english: "Water" },
            { nahuatl: "Tlalli", english: "Earth" },
            { nahuatl: "Tonatiuh", english: "Sun" },
            { nahuatl: "Yōllotl", english: "Heart" }
        ];

        function updateFlashcard() {
            const card = flashcards[currentCardIndex];
            document.getElementById('cardPrompt').innerText = showingTranslation ? "English Meaning" : "Nahuatl Term";
            document.getElementById('cardTerm').innerText = showingTranslation ? card.english : card.nahuatl;
            document.getElementById('cardCounter').innerText = `Card ${currentCardIndex + 1} of ${flashcards.length}`;
            document.getElementById('scoreTracker').innerText = `Streak: ${streak}`;
        }

        function flipCard() {
            showingTranslation = !showingTranslation;
            if (showingTranslation) streak++;
            updateFlashcard();
        }

        function nextCard() {
            showingTranslation = false;
            currentCardIndex = (currentCardIndex + 1) % flashcards.length;
            updateFlashcard();
        }

        function prevCard() {
            showingTranslation = false;
            currentCardIndex = (currentCardIndex - 1 + flashcards.length) % flashcards.length;
            updateFlashcard();
        }

        // Initialize on load
        renderDictionary(dictionaryData);
        updateFlashcard();
    </script>
</body>
</html>
