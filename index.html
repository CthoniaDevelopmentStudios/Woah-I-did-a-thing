<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azta - Adaptive Language Mastery</title>
    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #46a302;
            --accent: #1cb0f6;
            --bg: #f7f9fa;
            --card-bg: #ffffff;
            --text: #3c3c3c;
            --gray: #e5e5e5;
            --danger: #ff4b4b;
            --success: #58cc02;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: white;
            border-bottom: 2px solid var(--gray);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .stats-bar {
            display: flex;
            gap: 1.5rem;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .app-container {
            background: var(--card-bg);
            border: 2px solid var(--gray);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 4px 0 0 var(--gray);
            margin-bottom: 2rem;
        }

        .progress-container {
            background: var(--gray);
            height: 16px;
            border-radius: 8px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-bar {
            background: var(--primary);
            height: 100%;
            width: 20%;
            transition: width 0.3s ease;
            border-radius: 8px;
        }

        .lesson-header {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #4b4b4b;
        }

        .challenge-prompt {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .option-card {
            background: white;
            border: 2px solid var(--gray);
            border-bottom: 4px solid var(--gray);
            border-radius: 16px;
            padding: 1.25rem;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .option-card:hover {
            background: #f7f7f7;
            border-color: #cfcfcf;
        }

        .option-card.selected {
            background: #ddf4ff;
            border-color: var(--accent);
            color: #0077b6;
        }

        .footer-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid var(--gray);
            padding-top: 1.5rem;
            margin-top: 1rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-bottom: 4px solid var(--primary-dark);
            border-radius: 14px;
            padding: 0.9rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: filter 0.1s;
        }

        .btn:hover { filter: brightness(1.05); }
        .btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        .feedback {
            font-weight: 700;
            font-size: 1.2rem;
        }
        .feedback.correct { color: var(--success); }
        .feedback.incorrect { color: var(--danger); }

        .dictionary-tab {
            margin-top: 3rem;
            background: white;
            border: 2px solid var(--gray);
            border-radius: 20px;
            padding: 2rem;
        }

        .dictionary-tab h3 {
            margin-bottom: 1rem;
            color: #2b2b2b;
        }

        .dict-search {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 2px solid var(--gray);
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 1rem;
            outline: none;
        }
        .dict-search:focus { border-color: var(--accent); }

        .dict-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .dict-item {
            padding: 0.75rem;
            border-bottom: 1px solid var(--gray);
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Azta</div>
        <div class="stats-bar">
            <div class="stat-item">🔥 <span id="streakCount">3</span></div>
            <div class="stat-item">⚡ <span id="xpCount">120</span> XP</div>
            <div class="stat-item">❤️ <span id="heartsCount">5</span></div>
        </div>
    </header>

    <main>
        <div class="app-container">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div id="lessonArea">
                <div class="lesson-header" id="lessonHeader">Select the correct translation</div>
                <div class="challenge-prompt" id="challengePrompt">Calli</div>

                <div class="options-grid" id="optionsGrid">
                    <!-- Dynamic Options -->
                </div>

                <div class="footer-action">
                    <div class="feedback" id="feedbackMessage"></div>
                    <button class="btn" id="actionBtn" onclick="handleAction()">Check</button>
                </div>
            </div>
        </div>

        <div class="dictionary-tab">
            <h3>Nahuatl-English Lexicon (Live Linked Corpus)</h3>
            <input type="text" class="dict-search" id="dictInput" placeholder="Search dictionary database..." oninput="filterLexicon()">
            <ul class="dict-list" id="dictList">
                <!-- Populated Corpus -->
            </ul>
        </div>
    </main>

    <script>
        // Core Vocabulary Corpus paired from dictionary records
        const corpus = [
            { nahuatl: "Calli", english: "House", category: "Noun" },
            { nahuatl: "Atl", english: "Water", category: "Noun" },
            { nahuatl: "Tlalli", english: "Earth", category: "Noun" },
            { nahuatl: "Tonatiuh", english: "Sun", category: "Noun" },
            { nahuatl: "Yōllotl", english: "Heart", category: "Noun" },
            { nahuatl: "Māitl", english: "Hand", category: "Noun" },
            { nahuatl: "Cōātl", english: "Snake / Serpent", category: "Noun" },
            { nahuatl: "Teōtl", english: "God / Sacred energy", category: "Noun" }
        ];

        let currentIndex = 0;
        let scoreXP = 120;
        let streak = 3;
        let hearts = 5;
        let selectedOption = null;
        let currentChallenge = null;
        let state = 'answering'; // 'answering' or 'next'

        const lessons = [
            { prompt: "Calli", target: "House", distractors: ["Water", "Sun", "Earth"] },
            { prompt: "Atl", target: "Water", distractors: ["House", "Heart", "Hand"] },
            { prompt: "Tonatiuh", target: "Sun", distractors: ["Earth", "Snake", "Water"] },
            { prompt: "Yōllotl", target: "Heart", distractors: ["Hand", "House", "Sun"] },
            { prompt: "Tlalli", target: "Earth", distractors: ["Water", "God", "House"] }
        ];

        function loadLesson() {
            state = 'answering';
            selectedOption = null;
            document.getElementById('feedbackMessage').innerText = '';
            const btn = document.getElementById('actionBtn');
            btn.innerText = 'Check';
            btn.style.background = 'var(--primary)';

            currentChallenge = lessons[currentIndex];
            document.getElementById('challengePrompt').innerText = `What does "${currentChallenge.prompt}" mean?`;
            
            // Progress update
            const progressPercent = ((currentIndex) / lessons.length) * 100;
            document.getElementById('progressBar').style.width = `${Math.max(10, progressPercent)}%`;

            // Shuffle options
            let options = [currentChallenge.target, ...currentChallenge.distractors];
            options.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            options.forEach(opt => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.innerText = opt;
                card.onclick = () => selectOption(card, opt);
                grid.appendChild(card);
            });
        }

        function selectOption(cardElement, optionText) {
            if (state !== 'answering') return;
            document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
            cardElement.classList.add('selected');
            selectedOption = optionText;
        }

        function handleAction() {
            if (state === 'answering') {
                if (!selectedOption) return;
                
                const feedbackEl = document.getElementById('feedbackMessage');
                const btn = document.getElementById('actionBtn');

                if (selectedOption === currentChallenge.target) {
                    feedbackEl.innerText = 'Correct! Great job.';
                    feedbackEl.className = 'feedback correct';
                    scoreXP += 10;
                    document.getElementById('xpCount').innerText = scoreXP;
                } else {
                    feedbackEl.innerText = `Incorrect. The correct answer was "${currentChallenge.target}".`;
                    feedbackEl.className = 'feedback incorrect';
                    hearts = Math.max(0, hearts - 1);
                    document.getElementById('heartsCount').innerText = hearts;
                }

                btn.innerText = 'Continue';
                btn.style.background = 'var(--accent)';
                state = 'next';
            } else {
                currentIndex++;
                if (currentIndex < lessons.length) {
                    loadLesson();
                } else {
                    document.getElementById('lessonArea').innerHTML = `
                        <div style="text-align: center; padding: 2rem;">
                            <h2>🎉 Lesson Completed!</h2>
                            <p style="margin: 1rem 0; color: #666;">You've mastered this adaptive module.</p>
                            <button class="btn" onclick="resetApp()">Practice Again</button>
                        </div>
                    `;
                    document.getElementById('progressBar').style.width = '100%';
                }
            }
        }

        function resetApp() {
            currentIndex = 0;
            location.reload();
        }

        function renderLexicon(items) {
            const list = document.getElementById('dictList');
            list.innerHTML = '';
            items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'dict-item';
                li.innerHTML = `<span><strong>${item.nahuatl}</strong> (${item.category})</span> <span style="color:#666;">${item.english}</span>`;
                list.appendChild(li);
            });
        }

        function filterLexicon() {
            const query = document.getElementById('dictInput').value.toLowerCase();
            const filtered = corpus.filter(i => i.nahuatl.toLowerCase().includes(query) || i.english.toLowerCase().includes(query));
            renderLexicon(filtered);
        }

        // Initialize
        loadLesson();
        renderLexicon(corpus);
    </script>
</body>
</html>
